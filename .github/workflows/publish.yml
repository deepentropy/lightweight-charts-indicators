name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Local development uses an oakscriptjs commit (devDependencies); a release is built and tested with the
      # latest oakscriptjs release, which must be inside the peerDependencies range.
      - name: Use the latest oakscriptjs release
        run: |
          npm install --no-save oakscriptjs@latest
          version=$(node -p "require('oakscriptjs/package.json').version")
          range=$(node -p "require('./package.json').peerDependencies.oakscriptjs")
          npx --yes semver@7 -r "$range" "$version" || { echo "oakscriptjs $version is outside the peer range $range"; exit 1; }

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub release of the tag, notes from the commits since the previous tag
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
